# ProphetEngine dashboard theme - minimal and mostly neutral.
# Light and dark variants share one design (see dashboard/theme.py for the full
# token set used by the CSS and charts; keep the base values here in sync).
# Viewers switch from the app menu (top right) -> Settings -> Theme. Dark is the default.

[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseRadius = "small"
buttonRadius = "small"
showSidebarBorder = true
headingFontWeights = [600, 600, 600, 600, 500, 500]
headingFontSizes = ["1.9rem", "1.4rem", "1.1rem", "1rem", "0.92rem", "0.88rem"]
metricValueFontWeight = 600

[theme.light]
primaryColor = "#2d5b88"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"
borderColor = "#e4e4e7"
dataframeBorderColor = "#e4e4e7"
linkColor = "#2d5b88"
chartCategoricalColors = ["#2d5b88", "#71717a", "#a1a1aa", "#d4d4d8"]

[theme.light.sidebar]
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f4f4f5"

[theme.dark]
primaryColor = "#7da3cc"
backgroundColor = "#111113"
secondaryBackgroundColor = "#1c1c1f"
textColor = "#ededef"
borderColor = "#2a2a2f"
dataframeBorderColor = "#2a2a2f"
linkColor = "#7da3cc"
chartCategoricalColors = ["#7da3cc", "#a1a1aa", "#71717a", "#4a4a51"]

[theme.dark.sidebar]
backgroundColor = "#141416"
secondaryBackgroundColor = "#1c1c1f"

[server]
headless = true

[browser]
gatherUsageStats = false
